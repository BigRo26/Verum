<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Verum</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px;
      background: #fafafa;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 4px 0;
    }
    p.sub {
      font-size: 11px;
      color: #777;
      margin: 0 0 16px 0;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    #startBtn { background: #1a7f37; color: white; }
    #stopBtn { background: #c0392b; color: white; }
    #stopBtn:disabled, #startBtn:disabled { background: #ccc; cursor: not-allowed; }
    #status {
      font-size: 12px;
      color: #333;
      text-align: center;
      min-height: 18px;
      margin-top: 8px;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: red;
      margin-right: 6px;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <h1>Verum</h1>
  <p class="sub">Fact-check the audio playing in this tab</p>

  <button id="startBtn">Start Recording</button>
  <button id="stopBtn" disabled>Stop &amp; Analyze</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
